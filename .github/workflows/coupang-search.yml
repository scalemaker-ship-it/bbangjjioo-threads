name: 쿠팡 상품 검색 (리스트업)

# 수동 실행 전용. 키워드로 쿠팡 상품을 검색해 이름·가격·URL·이미지를 출력한다.
# COUPANG_ACCESS_KEY / COUPANG_SECRET_KEY 시크릿을 사용(값은 로그에 안 찍힘).
on:
  workflow_dispatch:
    inputs:
      keywords:
        description: "검색 키워드 ('|'로 여러 개, 예: 틈새 수납 카트|실리콘 밀폐 뚜껑)"
        type: string
        required: false
      limit:
        description: "키워드당 결과 수"
        type: string
        default: "5"
      deeplink_url:
        description: "이 상품 URL을 짧은 /a/ 어필리에이트 링크로 변환(있으면 검색 대신 실행)"
        type: string
        required: false
      threads_id:
        description: "이 스레드 게시물 ID의 permalink 조회(있으면 그것만 실행)"
        type: string
        required: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: requests 설치
        run: pip install requests
      - name: 쿠팡 상품 검색
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ -n "${{ inputs.threads_id }}" ]; then
            python -c "import os,requests;print(requests.get('https://graph.threads.net/v1.0/${{ inputs.threads_id }}',params={'fields':'permalink,text','access_token':os.environ['THREADS_ACCESS_TOKEN']}).text)"
          elif [ -n "${{ inputs.deeplink_url }}" ]; then
            python coupang.py deeplink "${{ inputs.deeplink_url }}"
          else
            python coupang.py search "${{ inputs.keywords }}" "${{ inputs.limit }}"
          fi
