name: 레시피 하루 1회 자동 게시

# 레시피 트랙 전용. 기존 쿠파스(coupas-daily.yml)·요일주제(threads-daily.yml)와 독립.
# 큐: recipe/recipe_queue.json — 맨 앞 1건씩 소비.
# 하루 2회. 각 슬롯마다 0~60분 랜덤 지연을 줘서 사람처럼 분산시킨다.
#   점심 슬롯: 12:00 KST = 03:00 UTC → 12:00~13:00 게시 (레시피 저장률 피크)
#   저녁 슬롯: 18:00 KST = 09:00 UTC → 18:00~19:00 게시 (저녁 장보기·저녁준비 시간대)
# 기존 트랙(꿀템 07·20·23시 / 요일주제 07~09·22~23시)과 시간이 겹치지 않는다.
on:
  schedule:
    - cron: "0 3 * * *"    # 12:00 KST
    - cron: "0 9 * * *"    # 18:00 KST
  workflow_dispatch:        # 수동 실행(테스트)

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: requests 설치
        run: pip install requests

      # 크론 실행일 때만 랜덤 지연 (수동 실행은 즉시)
      - name: 랜덤 지연 (게시 시각 분산)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 3600))
          echo "약 $((DELAY / 60))분 대기 후 게시합니다."
          sleep $DELAY

      - name: 레시피 큐에서 1건 게시
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python recipe/publish_recipe.py

      # 썸네일 미부착이면 게시 스텝이 실패로 끝나지만, 글은 이미 나갔으므로
      # 큐 커밋은 반드시 해야 한다(안 하면 내일 같은 글이 또 나감).
      - name: 큐 소비 커밋
        if: always()
        run: |
          git config user.name "recipe-bot"
          git config user.email "recipe-bot@users.noreply.github.com"
          git add recipe/recipe_queue.json
          git diff --quiet --cached || (git commit -m "레시피 큐 소비(1건 게시)" && (git push || (git pull --rebase && git push)))
