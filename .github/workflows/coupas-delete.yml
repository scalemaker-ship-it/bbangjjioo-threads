name: 쿠파스 게시물 삭제 (수동)
# 잘못 나간 게시물을 ID로 삭제. 여러 개면 공백으로 구분.
on:
  workflow_dispatch:
    inputs:
      thread_ids:
        description: "삭제할 게시물 ID (공백 구분)"
        required: true
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: 삭제 요청
        env:
          TOK: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          for ID in ${{ inputs.thread_ids }}; do
            echo "=== DELETE $ID ==="
            curl -s -X DELETE "https://graph.threads.net/v1.0/$ID?access_token=$TOK" ; echo
          done
